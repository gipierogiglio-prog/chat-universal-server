services:
  db:
    image: postgres:16-alpine
    container_name: chat-universal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
      POSTGRES_DB: chat_universal
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devgiglio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_universal"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: chat-universal-server
    image: ghcr.io/gipierogiglio-prog/chat-universal-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chat:***@db:5432/chat_universal?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HERMES_API_KEY: ${HERMES_API_KEY:-hermes-secret-key}
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-openclaw-secret-key}
      PORT: 3001
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - devgiglio-network

volumes:
  pgdata:
  uploads:

networks:
  devgiglio-network:
    external: true
